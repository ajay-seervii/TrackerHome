<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot Tracker</title>
  <link rel="stylesheet" href="app.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pt-bg: #f5f1e8;
      --pt-surface: #fefcf8;
      --pt-fg: #2d2d2d;
      --pt-muted: #6b6b6b;
      --pt-border: #e8dfd6;
      --pt-accent: #00a96b;
      --pt-on-accent: #ffffff;
      --pt-hover: #faf7f2;
      --pt-danger: #b91c1c;
      --gold: #c58a00;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--pt-bg);
      color: var(--pt-fg);
      line-height: 1.5;
      min-height: 100vh;
      padding: 24px 20px 48px;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    h1 { font-size: 28px; line-height: 1.2; letter-spacing: 0; }
    h2 { font-size: 18px; line-height: 1.3; letter-spacing: 0; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h2 .pt-icon { color: var(--pt-accent); }

    .muted { color: var(--pt-muted); }

    /* Signed-out */
    .welcome {
      max-width: 520px;
      margin: 12vh auto 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .welcome-mark {
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px;
      background: rgba(0, 169, 107, 0.12);
      color: var(--pt-accent);
    }
    .welcome-mark .pt-icon { width: 32px; height: 32px; }
    .welcome p { color: var(--pt-muted); }
    .welcome .error { color: var(--pt-danger); }

    /* Dashboard */
    .grid { display: grid; gap: 16px; }
    .hero { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); margin-bottom: 28px; }

    .card {
      background: var(--pt-surface);
      border: 1px solid var(--pt-border);
      border-radius: 12px;
      padding: 20px;
      min-width: 0;
    }

    .level-card { display: flex; gap: 20px; align-items: center; }
    .level-badge {
      width: 88px; height: 88px; flex-shrink: 0;
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: conic-gradient(var(--pt-accent) calc(var(--pct) * 1%), var(--pt-border) 0);
      position: relative;
    }
    .level-badge::before {
      content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--pt-surface);
    }
    .level-badge span { position: relative; line-height: 1; }
    .level-badge .lvl-num { font-size: 30px; font-weight: 800; }
    .level-badge .lvl-label { font-size: 11px; font-weight: 700; color: var(--pt-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .level-info { flex: 1; min-width: 0; }
    .level-title { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    .bar { height: 8px; background: var(--pt-border); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
    .bar > div { height: 100%; background: var(--pt-accent); border-radius: 4px; transition: width 0.5s ease; }
    .level-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--pt-muted); }

    .streak-card { display: flex; align-items: center; gap: 16px; }
    .streak-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(234, 88, 12, 0.12); color: #ea580c; flex-shrink: 0; }
    .streak-icon .pt-icon { width: 28px; height: 28px; }
    .streak-card.cold .streak-icon { background: var(--pt-hover); color: var(--pt-muted); }
    .streak-num { font-size: 28px; font-weight: 800; line-height: 1; }
    .streak-label { font-size: 13px; color: var(--pt-muted); }

    section { margin-bottom: 28px; }
    section[hidden] { display: none; }

    .trackers { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .tracker-card { display: flex; flex-direction: column; gap: 12px; color: inherit; text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .tracker-card:hover { border-color: var(--pt-accent); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06); }
    .tracker-head { display: flex; gap: 12px; align-items: flex-start; }
    .tracker-icon { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 169, 107, 0.12); color: var(--pt-accent); }
    .tracker-icon .pt-icon { width: 22px; height: 22px; }
    .tracker-name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
    .tracker-desc { font-size: 13px; color: var(--pt-muted); overflow-wrap: anywhere; }
    .tracker-stats { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--pt-muted); }
    .tracker-stats strong { color: var(--pt-fg); }
    .tracker-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--pt-hover); color: var(--pt-muted); }
    .tag .pt-icon { width: 14px; height: 14px; }
    .tag--warn { background: rgba(234, 179, 8, 0.15); color: #a16207; }
    .tracker-actions { display: flex; gap: 8px; margin-top: auto; }
    .tracker-actions .pt-btn { flex: 1; }

    .columns { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }

    .list { list-style: none; display: flex; flex-direction: column; }
    .list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--pt-border); min-width: 0; }
    .list li:last-child { border-bottom: none; }
    .list .grow { flex: 1; min-width: 0; }
    .list .title { font-weight: 600; overflow-wrap: anywhere; }
    .list .sub { font-size: 12px; color: var(--pt-muted); overflow-wrap: anywhere; }
    .amount { font-weight: 800; white-space: nowrap; }
    .amount.pos { color: var(--pt-accent); }
    .amount.neg { color: var(--pt-danger); }
    .ev-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--pt-hover); color: var(--pt-muted); flex-shrink: 0; }
    .ev-icon.gold { color: var(--gold); background: rgba(197, 138, 0, 0.12); }
    .ev-icon.green { color: var(--pt-accent); background: rgba(0, 169, 107, 0.12); }
    .empty { color: var(--pt-muted); font-size: 14px; padding: 8px 0; }

    .approve-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .approve-actions .pt-btn { min-height: 40px; padding: 8px 12px; }

    .family { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .family-card { display: flex; gap: 12px; align-items: center; }
    .family-lvl { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; background: rgba(0, 169, 107, 0.12); color: var(--pt-accent); flex-shrink: 0; }

    .profile summary { cursor: pointer; font-weight: 600; color: var(--pt-muted); min-height: 44px; display: flex; align-items: center; gap: 8px; width: fit-content; }
    .profile form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; margin-top: 8px; }
    .profile label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--pt-muted); }
    .profile input, .profile select { min-height: 44px; padding: 8px 10px; border: 1px solid var(--pt-border); border-radius: 8px; font: inherit; color: var(--pt-fg); background: #fff; }

    .tz-hint { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 20px; border: 1px solid rgba(234, 179, 8, 0.4); background: rgba(234, 179, 8, 0.08); border-radius: 10px; font-size: 14px; }
    .tz-hint[hidden] { display: none; }

    @media (max-width: 760px) {
      .hero, .columns { grid-template-columns: minmax(0, 1fr); }
      body { padding: 16px 12px 40px; }
    }
    @media (max-width: 420px) {
      .level-card { flex-direction: column; text-align: center; }
      .level-meta { justify-content: center; }
      .list li { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="welcome" id="welcome" hidden>
      <div class="welcome-mark" id="welcome-mark"></div>
      <h1>Level up your life</h1>
      <p>Track goals, earn XP and build streaks across all your trackers.</p>
      <div id="welcome-actions"></div>
      <p class="error" id="welcome-error" hidden></p>
    </div>

    <div id="dashboard" hidden>
      <div id="nav-host"></div>

      <div class="tz-hint" id="tz-hint" hidden></div>

      <div class="grid hero">
        <div class="card level-card">
          <div class="level-badge" id="level-badge" style="--pct: 0">
            <span class="lvl-num" id="life-level">1</span>
            <span class="lvl-label">Level</span>
          </div>
          <div class="level-info">
            <div class="level-title" id="greeting"></div>
            <div class="muted" id="life-total"></div>
            <div class="bar" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="100" id="life-bar-wrap"><div id="life-bar" style="width: 0%"></div></div>
            <div class="level-meta"><span id="life-into"></span><span id="life-next"></span></div>
          </div>
        </div>
        <div class="card streak-card" id="streak-card">
          <div class="streak-icon" id="streak-icon"></div>
          <div>
            <div class="streak-num" id="streak-num">0</div>
            <div class="streak-label" id="streak-label">day streak</div>
          </div>
        </div>
      </div>

      <section id="approvals-section" hidden>
        <h2 id="approvals-heading"></h2>
        <div class="card"><ul class="list" id="approvals-list"></ul></div>
      </section>

      <section>
        <h2 id="trackers-heading"></h2>
        <div class="grid trackers" id="trackers"></div>
      </section>

      <section id="family-section" hidden>
        <h2 id="family-heading"></h2>
        <div class="grid family" id="family"></div>
      </section>

      <section>
        <h2 id="activity-heading"></h2>
        <div class="card"><ul class="list" id="activity"></ul></div>
      </section>

      <details class="profile">
        <summary id="profile-summary"></summary>
        <form id="profile-form" class="card">
          <label>Display name<input id="profile-name" maxlength="60" autocomplete="nickname"></label>
          <label>Time zone (for streaks)<select id="profile-tz"></select></label>
          <button class="pt-btn pt-btn--primary pt-needs-online" type="submit">Save profile</button>
        </form>
      </details>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const ACHIEVEMENT_NAMES = { a1: 'Started', a2: 'Player', a3: 'Combat', a4: 'Polish', a5: 'Quarter', a6: 'Master' };
    const REASON_LABELS = { task: 'Task completed', achievement: 'Achievement', legacy_balance: 'Earlier progress', refund: 'Task unchecked', reset: 'Tracker reset', adjustment: 'Adjustment' };
    const params = new URLSearchParams(location.search);
    const next = PT.safeNext(params.get('next'));

    function heading(id, iconName, text) {
      document.getElementById(id).innerHTML = PT.icon(iconName) + `<span>${PT.esc(text)}</span>`;
    }

    function relTime(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
      if (diff < 86400) return Math.floor(diff / 3600) + ' h ago';
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' d ago';
      return new Date(iso).toLocaleDateString();
    }

    function showWelcome(errorText) {
      document.getElementById('dashboard').hidden = true;
      document.getElementById('welcome').hidden = false;
      document.getElementById('welcome-mark').innerHTML = PT.icon('trophy');
      const actions = document.getElementById('welcome-actions');
      actions.innerHTML = '';
      const btn = PT.button('Sign in with Google', 'log-in', async () => {
        btn.disabled = true;
        try {
          await PT.signIn(next);
        } catch (error) {
          btn.disabled = false;
          showWelcome(PT.friendlyError(error));
        }
      }, 'pt-btn--primary');
      actions.appendChild(btn);
      const err = document.getElementById('welcome-error');
      err.hidden = !errorText;
      err.textContent = errorText || '';
    }

    function showPending(email) {
      document.getElementById('dashboard').hidden = true;
      document.getElementById('welcome').hidden = false;
      document.getElementById('welcome-mark').innerHTML = PT.icon('clock');
      document.querySelector('#welcome h1').textContent = 'Waiting for approval';
      document.querySelector('#welcome p').textContent = `You are signed in as ${email || 'an unknown account'}. Ask the tracker owner to approve this account, then reload.`;
      const actions = document.getElementById('welcome-actions');
      actions.innerHTML = '';
      actions.appendChild(PT.button('Sign out', 'log-out', PT.signOut));
    }

    function renderLevel(data) {
      const life = PT.lifeLevel(data.life_xp);
      const name = data.user.display_name || (data.user.email || '').split('@')[0];
      document.getElementById('greeting').textContent = `Hi ${name}`;
      document.getElementById('life-level').textContent = life.level;
      document.getElementById('level-badge').style.setProperty('--pct', life.pct.toFixed(1));
      document.getElementById('life-total').textContent = `${data.life_xp.toLocaleString()} lifetime XP`;
      document.getElementById('life-bar').style.width = life.pct + '%';
      document.getElementById('life-bar-wrap').setAttribute('aria-valuenow', Math.round(life.pct));
      document.getElementById('life-into').textContent = `${life.into.toLocaleString()} / ${life.needed.toLocaleString()} XP`;
      document.getElementById('life-next').textContent = `${(life.needed - life.into).toLocaleString()} XP to level ${life.level + 1}`;

      const card = document.getElementById('streak-card');
      card.classList.toggle('cold', !data.streak);
      document.getElementById('streak-icon').innerHTML = PT.icon('flame');
      document.getElementById('streak-num').textContent = data.streak;
      document.getElementById('streak-label').textContent = data.streak ? 'day streak' : 'Complete a task today to start a streak';
    }

    function trackerHref(t) {
      return t.page || `tracker.html?t=${encodeURIComponent(t.slug || '')}`;
    }

    function renderTrackers(trackers) {
      heading('trackers-heading', 'target', 'Your trackers');
      const host = document.getElementById('trackers');
      host.innerHTML = '';
      if (!trackers.length) {
        host.innerHTML = '<p class="empty">No trackers yet. Ask the owner to give you access.</p>';
        return;
      }
      trackers.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card tracker-card';
        const pct = t.total_tasks ? Math.round((t.done_tasks / t.total_tasks) * 100) : 0;
        const iconName = PT.TRACKER_ICONS.includes(t.icon) ? t.icon : 'target';
        const isGuardian = t.role === 'guardian';
        card.innerHTML = `
          <div class="tracker-head">
            <div class="tracker-icon">${PT.icon(iconName)}</div>
            <div>
              <div class="tracker-name">${PT.esc(t.name)}</div>
              ${t.description ? `<div class="tracker-desc">${PT.esc(t.description)}</div>` : ''}
            </div>
          </div>
          ${isGuardian ? '' : `
          <div>
            <div class="bar"><div style="width: ${pct}%"></div></div>
            <div class="tracker-stats"><span><strong>${t.done_tasks}</strong> / ${t.total_tasks} tasks · ${pct}%</span><span><strong>${Number(t.xp).toLocaleString()}</strong> XP</span></div>
          </div>`}
          <div class="tracker-tags">
            ${isGuardian ? `<span class="tag">${PT.icon('shield')}Reviewer</span>` : ''}
            ${t.my_pending ? `<span class="tag tag--warn">${PT.icon('clock')}${t.my_pending} awaiting approval</span>` : ''}
            ${t.to_review ? `<span class="tag tag--warn">${PT.icon('check-circle')}${t.to_review} to review</span>` : ''}
          </div>
          <div class="tracker-actions"></div>`;
        const actions = card.querySelector('.tracker-actions');
        actions.appendChild(PT.link(isGuardian ? 'View tasks' : 'Open', 'arrow-right', trackerHref(t), 'pt-btn--primary'));
        if (t.is_creator) actions.appendChild(PT.link('Manage', 'pencil', `admin.html?t=${encodeURIComponent(t.slug || t.id)}`));
        host.appendChild(card);
      });
    }

    function renderApprovals(items) {
      const section = document.getElementById('approvals-section');
      section.hidden = !items.length;
      if (!items.length) return;
      heading('approvals-heading', 'shield', `Waiting for your approval (${items.length})`);
      const list = document.getElementById('approvals-list');
      list.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="ev-icon">${PT.icon('clock')}</div>
          <div class="grow">
            <div class="title">${PT.esc(item.task_title)}</div>
            <div class="sub">${PT.esc(item.user_name)} · ${PT.esc(item.tracker_name)} · ${relTime(item.completed_at)} · +${item.xp} XP</div>
          </div>
          <div class="approve-actions"></div>`;
        const actions = li.querySelector('.approve-actions');
        const review = approve => async () => {
          li.classList.add('pt-busy');
          try {
            await PT.rpc('pt_review_completion', { p_progress: item.id, p_approve: approve });
            PT.toast(approve ? `Approved: +${item.xp} XP for ${item.user_name}` : 'Sent back');
            await loadDashboard();
          } catch (error) {
            li.classList.remove('pt-busy');
            PT.toast(error.message, 'error');
          }
        };
        actions.appendChild(PT.button('Approve', 'check', review(true), 'pt-btn--primary pt-needs-online'));
        actions.appendChild(PT.button('Reject', 'x', review(false), 'pt-needs-online'));
        list.appendChild(li);
      });
    }

    function renderFamily(members) {
      const section = document.getElementById('family-section');
      section.hidden = !members.length;
      if (!members.length) return;
      heading('family-heading', 'users', 'Family');
      const host = document.getElementById('family');
      host.innerHTML = '';
      members.forEach(m => {
        const life = PT.lifeLevel(m.life_xp);
        const card = document.createElement('div');
        card.className = 'card family-card';
        card.innerHTML = `
          <div class="family-lvl" title="Level">${life.level}</div>
          <div class="grow">
            <div class="tracker-name">${PT.esc(m.name)}</div>
            <div class="tracker-desc">${Number(m.life_xp).toLocaleString()} XP · ${m.streak} day streak${m.pending ? ` · ${m.pending} pending` : ''}</div>
          </div>`;
        host.appendChild(card);
      });
    }

    function renderActivity(events) {
      heading('activity-heading', 'clock', 'Recent activity');
      const list = document.getElementById('activity');
      list.innerHTML = '';
      if (!events.length) {
        list.innerHTML = '<li class="empty">Nothing yet. Complete a task to earn your first XP.</li>';
        return;
      }
      events.forEach(e => {
        const li = document.createElement('li');
        const iconName = e.reason === 'achievement' ? 'trophy' : e.amount < 0 ? 'rotate-ccw' : 'check-circle';
        const tone = e.reason === 'achievement' ? 'gold' : e.amount > 0 ? 'green' : '';
        const title = e.reason === 'achievement' ? `Achievement: ${ACHIEVEMENT_NAMES[e.note] || e.note || ''}` : (e.task_title || REASON_LABELS[e.reason] || e.reason);
        li.innerHTML = `
          <div class="ev-icon ${tone}">${PT.icon(iconName)}</div>
          <div class="grow">
            <div class="title">${PT.esc(title)}</div>
            <div class="sub">${PT.esc(e.tracker_name)} · ${PT.esc(REASON_LABELS[e.reason] || e.reason)} · ${relTime(e.created_at)}</div>
          </div>
          <span class="amount ${e.amount >= 0 ? 'pos' : 'neg'}">${e.amount >= 0 ? '+' : ''}${e.amount} XP</span>`;
        list.appendChild(li);
      });
    }

    function renderProfile(user) {
      document.getElementById('profile-summary').innerHTML = PT.icon('settings') + '<span>Profile</span>';
      document.getElementById('profile-name').value = user.display_name || '';
      const select = document.getElementById('profile-tz');
      const zones = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : [];
      const all = Array.from(new Set(['UTC', user.timezone, ...zones].filter(Boolean)));
      select.innerHTML = all.map(z => `<option value="${PT.esc(z)}">${PT.esc(z)}</option>`).join('');
      select.value = user.timezone || 'UTC';

      const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const hint = document.getElementById('tz-hint');
      hint.hidden = !browserTz || browserTz === user.timezone;
      if (!hint.hidden) {
        hint.innerHTML = PT.icon('clock') + `<span>Streaks use ${PT.esc(user.timezone)}. Your device is on ${PT.esc(browserTz)}.</span>`;
        hint.appendChild(PT.button(`Use ${browserTz}`, null, () => saveProfile({ timezone: browserTz }), 'pt-needs-online'));
      }
    }

    async function saveProfile(changes) {
      try {
        const { error } = await PT.client.from('users').update(changes).eq('id', PT.me.id);
        if (error) throw new Error(PT.friendlyError(error));
        PT.toast('Profile saved');
        await loadDashboard();
      } catch (error) {
        PT.toast(error.message, 'error');
      }
    }

    document.getElementById('profile-form').addEventListener('submit', event => {
      event.preventDefault();
      saveProfile({
        display_name: document.getElementById('profile-name').value.trim() || null,
        timezone: document.getElementById('profile-tz').value,
      });
    });

    let navMounted = false;
    async function loadDashboard() {
      const data = await PT.rpc('pt_dashboard');
      if (!data.approved) {
        showPending(data.email);
        return;
      }
      document.getElementById('welcome').hidden = true;
      document.getElementById('dashboard').hidden = false;
      if (!navMounted) {
        PT.mountNav('#nav-host', { brand: 'Pivot Tracker' });
        navMounted = true;
      }
      renderLevel(data);
      renderApprovals(data.approvals);
      renderTrackers(data.trackers);
      renderFamily(data.family);
      renderActivity(data.recent);
      renderProfile(data.user);
    }

    async function start() {
      PT.showGate('Loading...');
      try {
        const profile = await PT.loadMe();
        if (!profile) {
          PT.hideGate();
          showWelcome();
          return;
        }
        if (profile.approved && next) {
          location.replace(next);
          return;
        }
        PT.watchSignOut();
        await loadDashboard();
        if (params.has('next') || params.has('code')) history.replaceState(null, '', location.pathname);
        PT.hideGate();
      } catch (error) {
        PT.hideGate();
        showWelcome(PT.friendlyError(error));
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !document.getElementById('dashboard').hidden) {
        loadDashboard().catch(() => {});
      }
    });

    start();
  </script>
</body>
</html>
