<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>TrackerHome</title>
  <meta name="theme-color" content="#0d0e1c">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pt-bg: #0d0e1c;
      --pt-surface: #171932;
      --pt-fg: #f2f3ff;
      --pt-muted: #9ca3cf;
      --pt-border: #272a52;
      --pt-accent: #8b5cf6;
      --pt-on-accent: #ffffff;
      --pt-hover: #1f2245;
      --pt-danger: #ff6b81;
      --gold: #ffc847;
      --flame: #ff8a3d;
      --mint: #34d399;
      --pink: #ff5ca8;
      --sky: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(139, 92, 246, 0.25), transparent 60%),
        radial-gradient(700px 400px at 100% 0%, rgba(255, 92, 168, 0.15), transparent 60%),
        var(--pt-bg);
      background-attachment: fixed;
      color: var(--pt-fg);
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px 16px 48px;
    }

    .container { max-width: 960px; margin: 0 auto; }
    .card { background: var(--pt-surface); border: 1px solid var(--pt-border); border-radius: 20px; padding: 18px; min-width: 0; }
    section { margin-bottom: 22px; }
    h2 { display: flex; align-items: center; gap: 8px; font-size: 17px; letter-spacing: 0; margin-bottom: 12px; }
    h2 .pt-icon { color: var(--pt-accent); }
    h2 .count { margin-left: auto; font-size: 13px; color: var(--pt-muted); font-weight: 600; }
    .empty { color: var(--pt-muted); font-size: 14px; padding: 6px 0; }

    /* Signed-out */
    .welcome { max-width: 420px; margin: 14vh auto 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .welcome-mark { width: 76px; height: 76px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--pt-accent), var(--pink)); color: #fff; box-shadow: 0 12px 40px rgba(139, 92, 246, 0.45); }
    .welcome-mark .pt-icon { width: 38px; height: 38px; }
    .welcome h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; }
    .welcome p { color: var(--pt-muted); }
    .welcome .error { color: var(--pt-danger); font-size: 14px; }
    .welcome .pt-btn--primary { min-width: 240px; min-height: 52px; border-radius: 14px; font-size: 16px; }

    /* Player card */
    .player { display: flex; align-items: center; gap: 18px; background: linear-gradient(135deg, #241b4d 0%, #1a1c3a 60%); border-color: #3a2f78; }
    .ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--pct) * 1%), rgba(255, 255, 255, 0.08) 0); display: flex; align-items: center; justify-content: center; }
    .ring::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #1e1a44; }
    .ring .face { position: relative; width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--pt-accent), var(--pink)); font-size: 26px; font-weight: 800; }
    .ring .lvl { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); padding: 2px 10px; border-radius: 999px; background: var(--gold); color: #2a1d00; font-size: 12px; font-weight: 900; letter-spacing: 0.04em; white-space: nowrap; box-shadow: 0 4px 12px rgba(255, 200, 71, 0.4); }
    .player-info { flex: 1; min-width: 0; }
    .rank { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); }
    .rank .pt-icon { width: 14px; height: 14px; }
    .player h1 { font-size: 22px; line-height: 1.2; letter-spacing: 0; margin: 2px 0 10px; overflow-wrap: anywhere; }
    .xpbar { display: flex; height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .xpbar > div { height: 100%; background: linear-gradient(90deg, var(--gold), #ff9f43); box-shadow: 0 0 12px rgba(255, 200, 71, 0.6); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .xpbar > .xp-pending { box-shadow: none; }
    .xpmeta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--pt-muted); }
    .xpmeta strong { color: var(--pt-fg); }
    .pending-line { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 700; color: #facc15; }
    .pending-line .pt-icon { width: 14px; height: 14px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .stat { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 8px; }
    .stat-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .stat-icon .pt-icon { width: 24px; height: 24px; }
    .stat-value { font-size: 24px; font-weight: 900; line-height: 1.1; }
    .stat-label { font-size: 12px; color: var(--pt-muted); font-weight: 600; }
    .stat--flame .stat-icon { background: rgba(255, 138, 61, 0.15); color: var(--flame); }
    .stat--flame.cold .stat-icon { background: var(--pt-hover); color: var(--pt-muted); }
    .stat--mint .stat-icon { background: rgba(52, 211, 153, 0.15); color: var(--mint); }
    .goal { position: relative; width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(var(--sky) calc(var(--pct) * 1%), var(--pt-hover) 0); display: flex; align-items: center; justify-content: center; color: var(--sky); }
    .goal::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--pt-surface); }
    .goal .pt-icon { position: relative; width: 18px; height: 18px; }
    .goal.done { background: var(--sky); }
    .goal.done::before { background: var(--sky); }
    .goal.done .pt-icon { color: #06263a; }
    .flame-anim { animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 80%; }
    @keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }

    /* Week strip */
    .week { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .day { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; font-size: 12px; font-weight: 700; color: var(--pt-muted); }
    .day i { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--pt-hover); border: 2px solid transparent; font-style: normal; }
    .day.done i { background: linear-gradient(135deg, var(--flame), var(--pink)); color: #fff; }
    .day.done i .pt-icon { width: 16px; height: 16px; }
    .day.today { color: var(--pt-fg); }
    .day.today i { border-color: var(--gold); }
    .day.future { opacity: 0.4; }

    /* Quests */
    .quests { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .quest { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; }
    .quest-icon { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(139, 92, 246, 0.15); color: var(--pt-accent); }
    .quest-text { flex: 1; min-width: 0; }
    .quest-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; line-height: 1.3; }
    .quest-sub { font-size: 12px; color: var(--pt-muted); overflow-wrap: anywhere; }
    .xp-chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 200, 71, 0.15); color: var(--gold); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .xp-chip .pt-icon { width: 12px; height: 12px; }
    .do-btn { width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--mint); background: transparent; color: var(--mint); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, background 0.15s; }
    .do-btn:hover { background: rgba(52, 211, 153, 0.15); transform: scale(1.06); }
    .do-btn:active { transform: scale(0.94); }
    .do-btn .pt-icon { width: 22px; height: 22px; }

    /* Quest lines (trackers) */
    .trackers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .tracker { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; transition: transform 0.15s, border-color 0.15s; }
    .tracker:hover { transform: translateY(-2px); border-color: var(--pt-accent); }
    .pring { position: relative; width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--pct) * 1%), var(--pt-hover) 0); display: flex; align-items: center; justify-content: center; color: var(--c); }
    .pring::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--pt-surface); }
    .pring .pt-icon { position: relative; width: 24px; height: 24px; }
    .tracker-text { flex: 1; min-width: 0; }
    .tracker-name { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; line-height: 1.3; }
    .tracker-sub { font-size: 12px; color: var(--pt-muted); margin-top: 2px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; background: var(--pt-hover); color: var(--pt-muted); }
    .tag .pt-icon { width: 12px; height: 12px; }
    .tag--warn { background: rgba(255, 200, 71, 0.15); color: var(--gold); }
    .tracker .pt-chev { color: var(--pt-muted); flex-shrink: 0; }

    /* Badges */
    .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 14px 6px 12px; border-radius: 16px; background: var(--pt-surface); border: 1px solid var(--pt-border); }
    .badge-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 30%, #ffe28a, var(--gold) 55%, #d89400); color: #3a2600; box-shadow: 0 0 18px rgba(255, 200, 71, 0.45); }
    .badge-icon .pt-icon { width: 24px; height: 24px; }
    .badge-name { font-size: 12px; font-weight: 800; line-height: 1.2; }
    .badge-desc { font-size: 11px; color: var(--pt-muted); line-height: 1.2; }
    .badge.locked .badge-icon { background: var(--pt-hover); color: var(--pt-muted); box-shadow: none; }
    .badge.locked .badge-name { color: var(--pt-muted); }
    .badge-pending { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; background: rgba(250, 204, 21, 0.15); color: #facc15; font-size: 10px; font-weight: 800; }
    .badge-pending .pt-icon { width: 11px; height: 11px; }
    .reject-form { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    #approvals-list li { flex-wrap: wrap; }
    .reject-form input { flex: 1 1 200px; min-height: 40px; padding: 8px 12px; border: 1px solid var(--pt-border); border-radius: 10px; background: var(--pt-bg); color: var(--pt-fg); font: inherit; font-size: 14px; }
    .reject-form .pt-btn { min-height: 40px; padding: 8px 12px; }

    /* Lists */
    .list { list-style: none; display: flex; flex-direction: column; }
    .list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--pt-border); min-width: 0; }
    .list li:last-child { border-bottom: none; }
    .list .grow { flex: 1; min-width: 0; }
    .list .title { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
    .list .sub { font-size: 12px; color: var(--pt-muted); overflow-wrap: anywhere; }
    .amount { font-weight: 900; white-space: nowrap; font-size: 14px; }
    .amount.pos { color: var(--gold); }
    .amount.neg { color: var(--pt-danger); }
    .ev-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--pt-hover); color: var(--pt-muted); flex-shrink: 0; }
    .ev-icon .pt-icon { width: 16px; height: 16px; }
    .ev-icon.gold { color: var(--gold); background: rgba(255, 200, 71, 0.15); }
    .ev-icon.green { color: var(--mint); background: rgba(52, 211, 153, 0.15); }
    .approve-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .approve-actions .pt-btn { min-height: 40px; padding: 8px 12px; }

    .family { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .member { display: flex; align-items: center; gap: 12px; }
    .member .pt-avatar { background: linear-gradient(135deg, var(--sky), var(--pt-accent)); }
    .member-lvl { margin-left: auto; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #2a1d00; font-size: 11px; font-weight: 900; white-space: nowrap; }

    /* Level-up celebration */
    .levelup { position: fixed; inset: 0; z-index: 7000; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(5, 6, 20, 0.8); backdrop-filter: blur(6px); overflow: hidden; }
    .levelup-box { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
    .levelup-box .burst { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #ffe28a, var(--gold) 60%, #d89400); color: #3a2600; font-size: 44px; font-weight: 900; box-shadow: 0 0 60px rgba(255, 200, 71, 0.7); }
    .levelup-box h2 { font-size: 28px; justify-content: center; margin: 6px 0 0; }
    .levelup-box p { color: var(--pt-muted); }
    .confetti { position: absolute; top: -10vh; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fall { to { transform: translateY(120vh) rotate(720deg); } }

    @media (max-width: 560px) {
      body { padding: 12px 12px 40px; }
      .player { padding: 16px; gap: 14px; }
      .ring { width: 82px; height: 82px; }
      .ring .face { width: 62px; height: 62px; font-size: 22px; }
      .player h1 { font-size: 19px; }
      .stats { gap: 8px; }
      .stat-value { font-size: 20px; }
      .list li { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flame-anim, .levelup-box, .confetti { animation: none !important; }
      .confetti { display: none; }
      .xpbar > div { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="welcome" id="welcome" hidden>
      <div class="welcome-mark" id="welcome-mark"></div>
      <h1>Level up your life</h1>
      <p>Track goals, earn XP and build streaks across all your trackers.</p>
      <div id="welcome-actions"></div>
      <p class="error" id="welcome-error" hidden></p>
    </div>

    <div id="dashboard" hidden>
      <div id="nav-host"></div>

      <section class="card player" aria-label="Player level">
        <div class="ring" id="ring" style="--pct: 0">
          <div class="face" id="avatar"></div>
          <span class="lvl" id="lvl-badge">LV 1</span>
        </div>
        <div class="player-info">
          <span class="rank" id="rank"></span>
          <h1 id="greeting"></h1>
          <div class="xpbar" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="100" id="xpbar"><div id="xpfill" style="width: 0%"></div><div id="xppend" class="xp-pending pt-pending-stripes" style="width: 0%"></div></div>
          <div class="xpmeta"><span id="xp-into"></span><span id="xp-total"></span></div>
          <div class="pending-line" id="xp-pending" hidden></div>
        </div>
      </section>

      <section class="stats">
        <div class="card stat stat--flame" id="stat-streak">
          <div class="stat-icon" id="streak-icon"></div>
          <div class="stat-value" id="streak-num">0</div>
          <div class="stat-label" id="streak-label">day streak</div>
        </div>
        <div class="card stat">
          <div class="goal" id="goal" style="--pct: 0"></div>
          <div class="stat-value" id="today-xp">0</div>
          <div class="stat-label" id="goal-label">of 50 XP today</div>
        </div>
        <div class="card stat stat--mint">
          <div class="stat-icon" id="done-icon"></div>
          <div class="stat-value" id="tasks-done">0</div>
          <div class="stat-label">quests done</div>
        </div>
      </section>

      <section class="card">
        <div class="week" id="week"></div>
      </section>

      <section id="approvals-section" hidden>
        <h2 id="approvals-heading"></h2>
        <div class="card"><ul class="list" id="approvals-list"></ul></div>
      </section>

      <section id="quests-section" hidden>
        <h2 id="quests-heading"></h2>
        <ul class="quests" id="quests"></ul>
      </section>

      <section>
        <h2 id="trackers-heading"></h2>
        <div class="trackers" id="trackers"></div>
      </section>

      <section>
        <h2 id="badges-heading"></h2>
        <div class="badges" id="badges"></div>
      </section>

      <section id="family-section" hidden>
        <h2 id="family-heading"></h2>
        <div class="family" id="family"></div>
      </section>

      <section>
        <h2 id="activity-heading"></h2>
        <div class="card"><ul class="list" id="activity"></ul></div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const ACHIEVEMENT_NAMES = { a1: 'Started', a2: 'Player', a3: 'Combat', a4: 'Polish', a5: 'Quarter', a6: 'Master' };
    const REASON_LABELS = { task: 'Task completed', achievement: 'Achievement', legacy_balance: 'Earlier progress', refund: 'Task unchecked', reset: 'Tracker reset', adjustment: 'Adjustment', rejected: 'Sent back by reviewer' };
    const params = new URLSearchParams(location.search);
    const next = PT.safeNext(params.get('next'));
    const $ = id => document.getElementById(id);
    const DAILY_GOAL = 50;
    const COLORS = ['#8b5cf6', '#38bdf8', '#34d399', '#ff8a3d', '#ff5ca8', '#ffc847'];
    const rankFor = PT.rankFor;

    // How much of a badge's value comes from ticks still waiting for review.
    function pendingPart(badge, data) {
      const t = badge.tracker_id && data.trackers.find(x => x.id === badge.tracker_id);
      switch (badge.metric) {
        case 'tasks_done': return Number(data.pending_count) || 0;
        case 'life_xp': return Number(data.pending_xp) || 0;
        case 'today_xp': return Number(data.today_pending_xp) || 0;
        case 'tracker_tasks_done': return t ? Number(t.my_pending) || 0 : 0;
        case 'tracker_xp': return t ? Number(t.pending_xp) || 0 : 0;
        default: return 0;
      }
    }

    function badgeValue(badge, data, level) {
      const t = badge.tracker_id && data.trackers.find(x => x.id === badge.tracker_id);
      switch (badge.metric) {
        case 'tasks_done': return Number(data.tasks_done);
        case 'best_streak': return Number(data.best_streak);
        case 'current_streak': return Number(data.streak);
        case 'level': return level;
        case 'life_xp': return Number(data.life_xp);
        case 'today_xp': return Number(data.today_xp);
        case 'tracker_tasks_done': return t ? Number(t.done_tasks) : 0;
        case 'tracker_percent': return t && t.total_tasks ? Math.round((t.done_tasks / t.total_tasks) * 100) : 0;
        case 'tracker_xp': return t ? Number(t.xp) : 0;
        default: return 0;
      }
    }

    function heading(id, iconName, text, count) {
      $(id).innerHTML = PT.icon(iconName) + `<span>${PT.esc(text)}</span>` + (count ? `<span class="count">${PT.esc(count)}</span>` : '');
    }

    function iconOf(t) {
      return PT.TRACKER_ICONS.includes(t.icon) ? t.icon : 'target';
    }

    function relTime(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
      if (diff < 86400) return Math.floor(diff / 3600) + ' h ago';
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' d ago';
      return new Date(iso).toLocaleDateString();
    }

    function showWelcome(errorText) {
      document.getElementById('dashboard').hidden = true;
      document.getElementById('welcome').hidden = false;
      document.getElementById('welcome-mark').innerHTML = PT.icon('trophy');
      const actions = document.getElementById('welcome-actions');
      actions.innerHTML = '';
      const btn = PT.button('Sign in with Google', 'log-in', async () => {
        btn.disabled = true;
        try {
          await PT.signIn(next);
        } catch (error) {
          btn.disabled = false;
          showWelcome(PT.friendlyError(error));
        }
      }, 'pt-btn--primary');
      actions.appendChild(btn);
      const err = document.getElementById('welcome-error');
      err.hidden = !errorText;
      err.textContent = errorText || '';
    }

    function showPending(email) {
      document.getElementById('dashboard').hidden = true;
      document.getElementById('welcome').hidden = false;
      document.getElementById('welcome-mark').innerHTML = PT.icon('clock');
      document.querySelector('#welcome h1').textContent = 'Waiting for approval';
      document.querySelector('#welcome p').textContent = `You are signed in as ${email || 'an unknown account'}. Ask the site admin to add this email, then reload.`;
      const actions = document.getElementById('welcome-actions');
      actions.innerHTML = '';
      actions.appendChild(PT.button('Sign out', 'log-out', PT.signOut));
    }

    function renderPlayer(data) {
      const life = PT.lifeLevel(data.life_xp);
      const name = data.user.display_name || (data.user.email || '').split('@')[0];
      $('avatar').textContent = PT.initials(name);
      $('lvl-badge').textContent = `LV ${life.level}`;
      $('ring').style.setProperty('--pct', life.pct.toFixed(1));
      $('rank').innerHTML = PT.icon('crown') + PT.esc(rankFor(life.level));
      $('greeting').textContent = name;
      const pending = Math.max(0, Number(data.pending_xp) || 0);
      // Only the part of pending XP inside the current level is drawn striped.
      const pendingPct = Math.min(life.pct, (pending / life.needed) * 100);
      $('xpfill').style.width = (life.pct - pendingPct) + '%';
      $('xppend').style.width = pendingPct + '%';
      $('xpbar').setAttribute('aria-valuenow', Math.round(life.pct));
      $('xp-into').innerHTML = `<strong>${life.into.toLocaleString()}</strong> / ${life.needed.toLocaleString()} XP to LV ${life.level + 1}`;
      $('xp-total').textContent = `${Number(data.life_xp).toLocaleString()} total XP`;
      $('xp-pending').hidden = !pending;
      $('xp-pending').innerHTML = pending ? `${PT.icon('clock')}${pending.toLocaleString()} XP pending review. It is removed if sent back.` : '';
      return life;
    }

    function renderStats(data) {
      $('stat-streak').classList.toggle('cold', !data.streak);
      $('streak-icon').innerHTML = PT.icon('flame', data.streak ? 'flame-anim' : '');
      $('streak-num').textContent = data.streak;
      $('streak-label').textContent = data.best_streak > data.streak ? `day streak · best ${data.best_streak}` : 'day streak';

      const today = Number(data.today_xp) || 0;
      const hit = today >= DAILY_GOAL;
      $('goal').style.setProperty('--pct', Math.min(100, (today / DAILY_GOAL) * 100).toFixed(1));
      $('goal').classList.toggle('done', hit);
      $('goal').innerHTML = PT.icon(hit ? 'check' : 'target');
      $('today-xp').textContent = today;
      const todayPending = Number(data.today_pending_xp) || 0;
      $('goal-label').textContent = (hit ? 'daily goal hit' : `of ${DAILY_GOAL} XP today`) + (todayPending ? ` · ${todayPending} pending` : '');

      $('done-icon').innerHTML = PT.icon('check-circle');
      $('tasks-done').textContent = Number(data.tasks_done).toLocaleString();
    }

    function renderWeek(week) {
      const host = $('week');
      host.innerHTML = '';
      (week || []).forEach(day => {
        const date = new Date(`${day.date}T00:00:00`);
        const el = document.createElement('div');
        el.className = 'day' + (day.done ? ' done' : '') + (day.today ? ' today' : '') + (day.future ? ' future' : '');
        el.title = date.toLocaleDateString();
        el.innerHTML = `<i>${day.done ? PT.icon('flame') : ''}</i><span>${PT.esc(date.toLocaleDateString(undefined, { weekday: 'narrow' }))}</span>`;
        host.appendChild(el);
      });
    }

    async function completeQuest(task, li) {
      li.classList.add('pt-busy');
      try {
        const res = await PT.completeTask(task.id);
        PT.announceCompletion(res, task.title);
        if (res.godot && res.godot.new_achievements && res.godot.new_achievements.length) PT.toast('Achievement unlocked!');
        await loadDashboard();
      } catch (error) {
        li.classList.remove('pt-busy');
        PT.toast(error.message, 'error');
      }
    }

    function renderQuests(trackers) {
      const quests = trackers.filter(t => t.next_task && t.can_edit && (t.role === 'owner' || t.role === 'member'));
      $('quests-section').hidden = !quests.length;
      if (!quests.length) return;
      heading('quests-heading', 'sparkles', 'Next quests');
      const list = $('quests');
      list.innerHTML = '';
      quests.forEach(t => {
        const task = t.next_task;
        const li = document.createElement('li');
        li.className = 'card quest';
        li.innerHTML = `
          <div class="quest-icon">${PT.icon(iconOf(t))}</div>
          <div class="quest-text">
            <div class="quest-title">${PT.esc(task.title)}</div>
            <div class="quest-sub">${PT.esc(t.name)}${task.repeat === 'daily' ? ' · Daily' : task.repeat === 'weekly' ? ' · Weekly' : ''}${t.requires_approval && t.role === 'member' ? ' · needs review' : ''}</div>
          </div>
          <span class="xp-chip">${PT.icon('zap')}+${Number(task.xp)}</span>`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'do-btn pt-needs-online';
        btn.setAttribute('aria-label', `Complete: ${task.title}`);
        btn.innerHTML = PT.icon('check');
        btn.addEventListener('click', () => completeQuest(task, li));
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    function trackerHref(t) {
      return `pages/${t.page || `tracker.html?t=${encodeURIComponent(t.slug || '')}`}`;
    }

    function renderTrackers(trackers) {
      heading('trackers-heading', 'target', 'Quest lines');
      const host = $('trackers');
      host.innerHTML = '';
      if (!trackers.length) {
        host.innerHTML = '<p class="empty">No trackers yet. Ask the owner to give you access.</p>';
        return;
      }
      trackers.forEach((t, i) => {
        const pct = t.total_tasks ? Math.round((t.done_tasks / t.total_tasks) * 100) : 0;
        const isGuardian = t.role === 'guardian';
        const tags = [
          !isGuardian && !t.can_edit ? `<span class="tag">${PT.icon('eye')}Read only</span>` : '',
          isGuardian ? `<span class="tag">${PT.icon('shield')}Reviewer</span>` : '',
          t.my_pending ? `<span class="tag tag--warn">${PT.icon('clock')}${t.pending_xp ? `${Number(t.pending_xp).toLocaleString()} XP pending` : `${t.my_pending} pending`}</span>` : '',
          t.to_review ? `<span class="tag tag--warn">${PT.icon('check-circle')}${t.to_review} to review</span>` : '',
        ].join('');
        const a = document.createElement('a');
        a.className = 'card tracker';
        a.href = trackerHref(t);
        a.innerHTML = `
          <div class="pring" style="--pct: ${pct}; --c: ${COLORS[i % COLORS.length]}">${PT.icon(iconOf(t))}</div>
          <div class="tracker-text">
            <div class="tracker-name">${PT.esc(t.name)}</div>
            <div class="tracker-sub">${isGuardian ? 'Review completions' : `${t.done_tasks}/${t.total_tasks} done · ${pct}% · ${Number(t.xp).toLocaleString()} XP`}</div>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
          </div>
          ${PT.icon('chevron-right', 'pt-chev')}`;
        host.appendChild(a);
      });
    }

    function renderBadges(data, level) {
      const badges = (data.badges || []).map(b => {
        const value = badgeValue(b, data, level);
        const ok = value >= b.threshold;
        const confirmedLevel = PT.lifeLevel(Number(data.life_xp) - (Number(data.pending_xp) || 0)).level;
        const confirmed = b.metric === 'level' ? confirmedLevel : value - pendingPart(b, data);
        return { ...b, ok, value, pending: ok && confirmed < b.threshold };
      });
      const earned = badges.filter(b => b.ok).length;
      heading('badges-heading', 'award', 'Badges', `${earned} / ${badges.length}`);
      $('badges').innerHTML = badges.map(b => {
        const iconName = /^[a-z-]+$/.test(b.icon) ? b.icon : 'award';
        const progress = b.ok ? PT.esc(b.description) : `${Math.min(b.value, b.threshold).toLocaleString()} / ${Number(b.threshold).toLocaleString()}`;
        const tip = b.pending ? `${b.description}. Pending review: lost if the ticks are sent back.` : b.description;
        return `<div class="badge ${b.ok ? '' : 'locked'}" title="${PT.esc(tip)}">
          <div class="badge-icon">${PT.icon(b.ok ? iconName : 'lock')}</div>
          <div class="badge-name">${PT.esc(b.name)}</div>
          <div class="badge-desc">${progress}</div>
          ${b.pending ? `<span class="badge-pending">${PT.icon('clock')}pending</span>` : ''}
        </div>`;
      }).join('');
      return badges;
    }

    function readJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback;
      } catch {
        return fallback;
      }
    }

    // Tells the player about badge changes and reviews since their last visit.
    function announceChanges(data, badges) {
      const uid = PT.me.id;
      const badgeKey = `pt-badges-${uid}`;
      const before = readJson(badgeKey, null);
      if (Array.isArray(before)) {
        badges.filter(b => b.ok && !before.includes(b.slug)).forEach(b => PT.toast(`Badge earned: ${b.name}`, 'reward'));
        badges.filter(b => !b.ok && before.includes(b.slug)).forEach(b => PT.toast(`Badge lost: ${b.name}`, 'error'));
      }
      localStorage.setItem(badgeKey, JSON.stringify(badges.filter(b => b.ok).map(b => b.slug)));

      const pendingKey = `pt-pending-${uid}`;
      const waiting = readJson(pendingKey, {});
      const reviews = new Map((data.reviews || []).map(r => [r.id, r]));
      Object.entries(waiting).forEach(([id, item]) => {
        const review = reviews.get(id);
        if (!review || !item) return;
        if (review.status === 'approved') PT.toast(`Approved: +${item.xp} XP for "${item.title}" is now confirmed`, 'reward');
        if (review.status === 'rejected') PT.toast(`Sent back: "${item.title}" (-${item.xp} XP)${review.note ? `. ${review.note}` : ''}`, 'error');
      });
      const nowWaiting = {};
      (data.my_pending || []).forEach(p => { nowWaiting[p.id] = { title: p.title, xp: p.xp }; });
      localStorage.setItem(pendingKey, JSON.stringify(nowWaiting));
    }

    function celebrate(level) {
      const overlay = document.createElement('div');
      overlay.className = 'levelup';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', 'Level up');
      const colors = ['#ffc847', '#8b5cf6', '#ff5ca8', '#34d399', '#38bdf8'];
      for (let i = 0; i < 48; i++) {
        const c = document.createElement('span');
        c.className = 'confetti';
        c.style.left = `${Math.random() * 100}%`;
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = `${2 + Math.random() * 2}s`;
        c.style.animationDelay = `${Math.random() * 0.6}s`;
        overlay.appendChild(c);
      }
      const box = document.createElement('div');
      box.className = 'levelup-box';
      box.innerHTML = `<div class="burst">${level}</div><h2>Level up!</h2><p>You are now a ${PT.esc(rankFor(level))}.</p>`;
      const close = PT.button('Keep going', 'rocket', () => overlay.remove(), 'pt-btn--primary');
      box.appendChild(close);
      overlay.appendChild(box);
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      close.focus();
    }

    function checkLevelUp(level) {
      const key = `pt-level-${PT.me.id}`;
      const previous = Number(localStorage.getItem(key) || 0);
      localStorage.setItem(key, String(level));
      if (previous && level > previous) celebrate(level);
    }

    function renderApprovals(items) {
      const section = document.getElementById('approvals-section');
      section.hidden = !items.length;
      if (!items.length) return;
      heading('approvals-heading', 'shield', `Waiting for your approval (${items.length})`);
      const list = document.getElementById('approvals-list');
      list.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="ev-icon">${PT.icon('clock')}</div>
          <div class="grow">
            <div class="title">${PT.esc(item.task_title)}</div>
            <div class="sub">${PT.esc(item.user_name)} · ${PT.esc(item.tracker_name)} · ${relTime(item.completed_at)} · +${item.xp} XP already given</div>
          </div>
          <div class="approve-actions"></div>`;
        const actions = li.querySelector('.approve-actions');
        const review = (approve, note) => async () => {
          li.classList.add('pt-busy');
          try {
            await PT.rpc('pt_review_completion', { p_progress: item.id, p_approve: approve, p_note: note || null });
            PT.toast(approve ? `Approved: ${item.xp} XP confirmed for ${item.user_name}` : `Sent back: ${item.xp} XP removed from ${item.user_name}`);
            await loadDashboard();
          } catch (error) {
            li.classList.remove('pt-busy');
            PT.toast(error.message, 'error');
          }
        };
        const showRejectForm = () => {
          actions.hidden = true;
          const form = document.createElement('form');
          form.className = 'reject-form';
          const input = document.createElement('input');
          input.maxLength = 200;
          input.placeholder = 'Reason (optional), e.g. Room still messy';
          input.setAttribute('aria-label', `Reason for sending back ${item.task_title}`);
          const send = PT.button('Send back', 'x', () => {}, 'pt-btn--danger pt-needs-online');
          send.type = 'submit';
          const cancel = PT.button('Cancel', null, () => { form.remove(); actions.hidden = false; });
          form.append(input, send, cancel);
          form.addEventListener('submit', event => {
            event.preventDefault();
            review(false, input.value.trim())();
          });
          li.appendChild(form);
          input.focus();
        };
        actions.appendChild(PT.button('Approve', 'check', review(true), 'pt-btn--primary pt-needs-online'));
        actions.appendChild(PT.button('Reject', 'x', showRejectForm, 'pt-needs-online'));
        list.appendChild(li);
      });
    }

    function renderFamily(members) {
      const section = document.getElementById('family-section');
      section.hidden = !members.length;
      if (!members.length) return;
      heading('family-heading', 'users', 'Family');
      const host = document.getElementById('family');
      host.innerHTML = '';
      members.forEach(m => {
        const life = PT.lifeLevel(m.life_xp);
        const card = document.createElement('div');
        card.className = 'card member';
        card.innerHTML = `
          <span class="pt-avatar">${PT.esc(PT.initials(m.name))}</span>
          <div style="flex: 1; min-width: 0">
            <div class="tracker-name">${PT.esc(m.name)}</div>
            <div class="tracker-sub">${Number(m.life_xp).toLocaleString()} XP · ${m.streak} day streak${m.pending ? ` · ${m.pending} pending` : ''}</div>
          </div>
          <span class="member-lvl">LV ${life.level}</span>`;
        host.appendChild(card);
      });
    }

    function renderActivity(events) {
      heading('activity-heading', 'clock', 'Recent activity');
      const list = document.getElementById('activity');
      list.innerHTML = '';
      if (!events.length) {
        list.innerHTML = '<li class="empty">Nothing yet. Complete a task to earn your first XP.</li>';
        return;
      }
      events.forEach(e => {
        const li = document.createElement('li');
        const iconName = e.reason === 'achievement' ? 'trophy' : e.reason === 'rejected' ? 'x' : e.amount < 0 ? 'rotate-ccw' : 'check-circle';
        const tone = e.reason === 'achievement' ? 'gold' : e.amount > 0 ? 'green' : '';
        const title = e.reason === 'achievement' ? `Achievement: ${ACHIEVEMENT_NAMES[e.note] || e.note || ''}` : (e.task_title || REASON_LABELS[e.reason] || e.reason);
        const reason = REASON_LABELS[e.reason] || e.reason;
        li.innerHTML = `
          <div class="ev-icon ${tone}">${PT.icon(iconName)}</div>
          <div class="grow">
            <div class="title">${PT.esc(title)}</div>
            <div class="sub">${PT.esc(e.tracker_name)} · ${PT.esc(e.reason === 'rejected' && e.note ? `${reason}: ${e.note}` : reason)} · ${relTime(e.created_at)}</div>
          </div>
          <span class="amount ${e.amount >= 0 ? 'pos' : 'neg'}">${e.amount >= 0 ? '+' : ''}${e.amount} XP</span>`;
        list.appendChild(li);
      });
    }

    let navMounted = false;
    async function loadDashboard() {
      const data = await PT.rpc('pt_dashboard');
      if (!data.approved) {
        showPending(data.email);
        return;
      }
      $('welcome').hidden = true;
      $('dashboard').hidden = false;
      if (!navMounted) {
        PT.mountNav('#nav-host', { brand: 'TrackerHome' });
        navMounted = true;
      }
      const life = renderPlayer(data);
      renderStats(data);
      renderWeek(data.week);
      renderApprovals(data.approvals);
      renderQuests(data.trackers);
      renderTrackers(data.trackers);
      const badges = renderBadges(data, life.level);
      renderFamily(data.family);
      renderActivity(data.recent);
      checkLevelUp(life.level);
      announceChanges(data, badges);
    }

    document.addEventListener('pt:profile', () => loadDashboard().catch(() => {}));

    async function start() {
      PT.showGate('Loading...');
      try {
        const profile = await PT.loadMe();
        if (!profile) {
          PT.hideGate();
          showWelcome();
          return;
        }
        if (profile.approved && next) {
          location.replace(next);
          return;
        }
        PT.watchSignOut();
        await loadDashboard();
        if (params.has('next') || params.has('code')) history.replaceState(null, '', location.pathname);
        PT.hideGate();
      } catch (error) {
        PT.hideGate();
        showWelcome(PT.friendlyError(error));
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !document.getElementById('dashboard').hidden) {
        loadDashboard().catch(() => {});
      }
    });

    start();
  </script>
</body>
</html>
